AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Dunlop Sellout Reporter — S3, Lambda, API Gateway, NAT Gateway, EventBridge, CloudWatch

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
  AlertEmail:
    Type: String
    Default: andy@ietires.com
    Description: Email for CloudWatch alarm notifications

Globals:
  Function:
    Runtime: python3.12
    Timeout: 300
    MemorySize: 512
    Tags:
      Project: DunlopReporter

Resources:

  # ═══════════════════════════════════════════════════════════════════════════
  # S3 BUCKETS
  # ═══════════════════════════════════════════════════════════════════════════

  JmkUploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: ietires-dunlop-jmk-uploads
      Tags:
        - Key: Project
          Value: DunlopReporter

  OutputCsvsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: ietires-dunlop-output-csvs
      Tags:
        - Key: Project
          Value: DunlopReporter

  RunLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: ietires-dunlop-run-logs
      Tags:
        - Key: Project
          Value: DunlopReporter

  # ═══════════════════════════════════════════════════════════════════════════
  # SECRETS MANAGER
  # ═══════════════════════════════════════════════════════════════════════════

  ImapRelaySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: dunlop-reporter/imap-relay-secret
      Description: Shared secret for the IMAP relay (Convex includes it as X-Relay-Secret)
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: relaySecret
        PasswordLength: 48
        ExcludePunctuation: true

  SftpCredentials:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: dunlop-reporter/sftp-credentials
      Description: SFTP credentials for Dunlop dev and prod environments
      SecretString: !Sub |
        {
          "sftp_dev": {
            "host": "landpdev.srnatire.com",
            "port": 22,
            "username": "dealer_sellout",
            "password": "KIp6Kzybr9klfgqm8rH2",
            "directory": "inbound"
          },
          "sftp_prod": {
            "host": "landp.srnatire.com",
            "port": 22,
            "username": "TBD",
            "password": "TBD",
            "directory": "inbound"
          }
        }
      Tags:
        - Key: Project
          Value: DunlopReporter

  # ═══════════════════════════════════════════════════════════════════════════
  # VPC + NAT GATEWAY (Static IP for SFTP whitelist)
  # ═══════════════════════════════════════════════════════════════════════════

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: dunlop-reporter-vpc
        - Key: Project
          Value: DunlopReporter

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: dunlop-public-subnet

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: dunlop-private-subnet

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: dunlop-private-subnet-2

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: dunlop-igw

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  ElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: dunlop-nat-eip
        - Key: Project
          Value: DunlopReporter

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt ElasticIP.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: dunlop-nat-gateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: dunlop-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: dunlop-private-rt

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Dunlop Lambda functions
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to S3 and Secrets Manager
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH/SFTP to Dunlop
      Tags:
        - Key: Name
          Value: dunlop-lambda-sg

  # ═══════════════════════════════════════════════════════════════════════════
  # IAM ROLES
  # ═══════════════════════════════════════════════════════════════════════════

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dunlop-reporter-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: DunlopReporterS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${JmkUploadsBucket}/*"
                  - !Sub "arn:aws:s3:::${OutputCsvsBucket}/*"
                  - !Sub "arn:aws:s3:::${RunLogsBucket}/*"
                  - "arn:aws:s3:::ietires-sales-data/*"
                  - !Sub "arn:aws:s3:::${JmkUploadsBucket}"
                  - !Sub "arn:aws:s3:::${OutputCsvsBucket}"
                  - !Sub "arn:aws:s3:::${RunLogsBucket}"
                  - "arn:aws:s3:::ietires-sales-data"
        - PolicyName: DunlopReporterSecretsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:UpdateSecret
                Resource:
                  - !Ref SftpCredentials
                  - !Ref ImapRelaySecret
      Tags:
        - Key: Project
          Value: DunlopReporter

  # ═══════════════════════════════════════════════════════════════════════════
  # LAMBDA FUNCTIONS
  # ═══════════════════════════════════════════════════════════════════════════

  GeneratePresignedUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dunlop-generate-presigned-url
      Handler: generate_presigned_url.handler
      CodeUri: lambdas/
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          S3_JMK_UPLOADS_BUCKET: !Ref JmkUploadsBucket
          S3_OUTPUT_CSVS_BUCKET: !Ref OutputCsvsBucket
      Events:
        Api:
          Type: Api
          Properties:
            Path: /dunlop/upload-url
            Method: post
            RestApiId: !Ref DunlopApi

  TransformAndUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dunlop-transform-and-upload
      Handler: transform_and_upload.handler
      CodeUri: lambdas/
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 600
      MemorySize: 1024
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet
          - !Ref PrivateSubnet2
      Environment:
        Variables:
          S3_JMK_UPLOADS_BUCKET: !Ref JmkUploadsBucket
          S3_OUTPUT_CSVS_BUCKET: !Ref OutputCsvsBucket
          S3_RUN_LOGS_BUCKET: !Ref RunLogsBucket
          S3_SALES_DATA_BUCKET: ietires-sales-data
          SFTP_SECRETS_ARN: !Ref SftpCredentials
          CONVEX_URL: https://outstanding-dalmatian-787.convex.cloud
      Layers:
        - !Ref ParamikoLayer
      Events:
        Api:
          Type: Api
          Properties:
            Path: /dunlop/run
            Method: post
            RestApiId: !Ref DunlopApi

  FetchHistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dunlop-fetch-history
      Handler: fetch_history.handler
      CodeUri: lambdas/
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          S3_RUN_LOGS_BUCKET: !Ref RunLogsBucket
      Events:
        ApiGet:
          Type: Api
          Properties:
            Path: /dunlop/history
            Method: get
            RestApiId: !Ref DunlopApi
        ApiDelete:
          Type: Api
          Properties:
            Path: /dunlop/history
            Method: delete
            RestApiId: !Ref DunlopApi

  ManageSettingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dunlop-manage-settings
      Handler: manage_settings.handler
      CodeUri: lambdas/
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          SFTP_SECRETS_ARN: !Ref SftpCredentials
      Events:
        ApiGet:
          Type: Api
          Properties:
            Path: /dunlop/settings
            Method: get
            RestApiId: !Ref DunlopApi
        ApiPut:
          Type: Api
          Properties:
            Path: /dunlop/settings
            Method: put
            RestApiId: !Ref DunlopApi

  # Dry-run SFTP connectivity check. Separate from ManageSettingsFunction so
  # attaching a VPC (needed to egress via the whitelisted static IP) doesn't
  # add cold-start latency to the plain settings GET/PUT.
  TestSftpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dunlop-test-sftp
      Handler: test_sftp.handler
      CodeUri: lambdas/
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet
          - !Ref PrivateSubnet2
      Environment:
        Variables:
          SFTP_SECRETS_ARN: !Ref SftpCredentials
      Layers:
        - !Ref ParamikoLayer
      Events:
        ApiPost:
          Type: Api
          Properties:
            Path: /dunlop/settings/test
            Method: post
            RestApiId: !Ref DunlopApi

  ImapRelayFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dunlop-imap-relay
      Handler: imap_relay.handler
      CodeUri: lambdas/
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      MemorySize: 512
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet
          - !Ref PrivateSubnet2
      Environment:
        Variables:
          RELAY_SECRET_ARN: !Ref ImapRelaySecret
      Events:
        Fetch:
          Type: Api
          Properties:
            Path: /imap/fetch
            Method: post
            RestApiId: !Ref DunlopApi
        FetchOne:
          Type: Api
          Properties:
            Path: /imap/fetch-one
            Method: post
            RestApiId: !Ref DunlopApi
        Folders:
          Type: Api
          Properties:
            Path: /imap/folders
            Method: post
            RestApiId: !Ref DunlopApi

  # ───────────────────────────────────────────────────────────────────
  # OEIVAL processor — triggered on PUT to jmk-uploads/oeival/*. Streams
  # the CSV, builds a slim cached JSON at
  # jmk-uploads/oeival/_cache/latest.json. The Vercel inventory route
  # reads only that cache so 200MB OEIVAL files never touch Vercel's
  # 2GB function memory ceiling.
  # NOTE: S3 event wiring is configured POST-deploy via the AWS CLI to
  # avoid SAM's circular-dependency error when the same bucket is used
  # by multiple Lambdas declared in this template. See the lambda
  # permission + bucket notification commands in the README / CI.
  OeivalProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dunlop-oeival-processor
      Handler: oeival_processor.handler
      CodeUri: lambdas/
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 2048
      Environment:
        Variables:
          S3_JMK_UPLOADS_BUCKET: !Ref JmkUploadsBucket

  FetchSalesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dunlop-fetch-sales
      Handler: fetch_sales.handler
      CodeUri: lambdas/
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 1024
      Environment:
        Variables:
          S3_SALES_DATA_BUCKET: ietires-sales-data
      Events:
        Api:
          Type: Api
          Properties:
            Path: /dunlop/sales
            Method: get
            RestApiId: !Ref DunlopApi

  # Paramiko Lambda layer (for SFTP)
  ParamikoLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: paramiko-layer
      Description: paramiko SSH library for SFTP uploads
      ContentUri: layers/paramiko/
      CompatibleRuntimes:
        - python3.12

  # ═══════════════════════════════════════════════════════════════════════════
  # API GATEWAY
  # ═══════════════════════════════════════════════════════════════════════════

  DunlopApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: dunlop-reporter-api
      StageName: !Ref Stage
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type'"
        AllowMethods: "'GET,POST,OPTIONS'"
      Tags:
        Project: DunlopReporter

  # ═══════════════════════════════════════════════════════════════════════════
  # EVENTBRIDGE — Monthly Cron (1st of month, 6 AM ET)
  # ═══════════════════════════════════════════════════════════════════════════

  MonthlyTriggerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: dunlop-monthly-report
      Description: Trigger Dunlop sellout report on 1st of each month
      ScheduleExpression: "cron(0 10 1 * ? *)"  # 10 UTC = 6 AM ET
      State: DISABLED  # Enable after backfill is complete
      Targets:
        - Arn: !GetAtt TransformAndUploadFunction.Arn
          Id: dunlop-monthly-target
          Input: !Sub |
            {
              "s3_key": "jmk-uploads/LATEST/latest.csv",
              "month": "AUTO",
              "env": "prod",
              "runBy": "EventBridge (monthly cron)"
            }
      Tags:
        - Key: Project
          Value: DunlopReporter

  MonthlyTriggerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TransformAndUploadFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MonthlyTriggerRule.Arn

  # ═══════════════════════════════════════════════════════════════════════════
  # CLOUDWATCH ALARMS
  # ═══════════════════════════════════════════════════════════════════════════

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: dunlop-reporter-alarms
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail
      Tags:
        - Key: Project
          Value: DunlopReporter

  TransformErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: dunlop-transform-errors
      AlarmDescription: Alert when Dunlop transform Lambda has errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref TransformAndUploadFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlarmTopic

  # ═══════════════════════════════════════════════════════════════════════════
  # INBOUND SFTP (AWS Transfer Family) — JMK hourly sales + inventory feed
  #   JMK logs in (password) and uploads to /sales and /inventory:
  #     /sales      -> s3://.../jmk-uploads/sftp-sales/  (sales dashboard refresh)
  #     /inventory  -> s3://.../jmk-uploads/oeival/       (existing OEIVAL trigger)
  #   Manual uploads (presigned URL + /dunlop/run) are untouched.
  # ═══════════════════════════════════════════════════════════════════════════

  JmkSftpUserSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: dunlop-reporter/jmk-sftp-user
      Description: Inbound SFTP login for JMK (username + password); read by the IdP Lambda
      GenerateSecretString:
        SecretStringTemplate: '{"username":"jmk"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: DunlopReporter

  JmkSftpAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dunlop-jmk-sftp-access
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: transfer.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: JmkSftpS3Scoped
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # NOTE the globs have NO trailing slash before the `*`. When a client
              # opens the LOGICAL root "/", Transfer enumerates the mapping targets
              # using the target path *without* a trailing slash, i.e. s3:prefix is
              # "jmk-uploads/oeival" — which "jmk-uploads/oeival/*" does NOT match.
              # With the slash, `ls /` returns "Access denied" and the client shows
              # no folders at all, while `ls /inventory` still works (verified by
              # A/B-testing both forms against the live server).
              - Sid: List
                Effect: Allow
                Action: s3:ListBucket
                Resource: arn:aws:s3:::ietires-dunlop-jmk-uploads
                Condition:
                  StringLike:
                    s3:prefix:
                      - "jmk-uploads/sftp-sales*"
                      - "jmk-uploads/oeival*"
              # Upload-only: PutObject only. No GetObject (read) or DeleteObject
              # (delete) — JMK can drop files but cannot download or remove anything.
              # Keep these ARNs slash-terminated: granting PutObject on the bare
              # "…/sftp-sales" key would let a client create an object whose name
              # equals the prefix, which makes Transfer treat the mapped directory
              # as a file and breaks listing (see the 2026-06-24 marker incident).
              - Sid: UploadOnly
                Effect: Allow
                Action: [s3:PutObject]
                Resource:
                  - arn:aws:s3:::ietires-dunlop-jmk-uploads/jmk-uploads/sftp-sales/*
                  - arn:aws:s3:::ietires-dunlop-jmk-uploads/jmk-uploads/oeival/*

  TransferLoggingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dunlop-sftp-logging
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: transfer.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: TransferCloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:DescribeLogStreams, logs:PutLogEvents]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/transfer/*"

  SftpIdpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dunlop-sftp-idp
      Handler: sftp_idp.handler
      CodeUri: lambdas/
      Runtime: python3.12
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          SFTP_USER_SECRET_ID: !Ref JmkSftpUserSecret
          SFTP_USER_ROLE_ARN: !GetAtt JmkSftpAccessRole.Arn
          S3_JMK_UPLOADS_BUCKET: ietires-dunlop-jmk-uploads
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JmkSftpUserSecret

  SftpIdpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SftpIdpFunction
      Action: lambda:InvokeFunction
      Principal: transfer.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  JmkSftpServer:
    Type: AWS::Transfer::Server
    Properties:
      Protocols: [SFTP]
      EndpointType: PUBLIC
      Domain: S3
      IdentityProviderType: AWS_LAMBDA
      IdentityProviderDetails:
        Function: !GetAtt SftpIdpFunction.Arn
      LoggingRole: !GetAtt TransferLoggingRole.Arn
      Tags:
        - Key: Project
          Value: DunlopReporter

  # Lets S3 invoke transform-and-upload for the new sftp-sales/ prefix.
  # (The bucket notification itself is merged post-deploy so the existing
  #  OEIVAL trigger is preserved — see deploy notes.)
  TransformS3InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TransformAndUploadFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: arn:aws:s3:::ietires-dunlop-jmk-uploads

Outputs:
  SftpEndpoint:
    Description: SFTP hostname for JMK
    Value: !Sub "${JmkSftpServer.ServerId}.server.transfer.${AWS::Region}.amazonaws.com"

  SftpServerId:
    Description: Transfer Family server ID
    Value: !Ref JmkSftpServer

  JmkSftpUserSecretArn:
    Description: Secrets Manager ARN holding JMK's SFTP username/password
    Value: !Ref JmkSftpUserSecret

  ApiUrl:
    Description: API Gateway URL for Dunlop Reporter
    Value: !Sub "https://${DunlopApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"

  ElasticIpAddress:
    Description: Static IP for SFTP whitelist — provide to Eusebio Castaneda
    Value: !Ref ElasticIP

  SftpSecretsArn:
    Description: ARN for SFTP credentials in Secrets Manager
    Value: !Ref SftpCredentials
