plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ietires.scanneragent'
    compileSdk 34

    defaultConfig {
        applicationId "com.ietires.scanneragent"
        minSdk 25  // Zebra TC51 runs Android 8.1 (API 27)
        // Target 25 (pre-O): DevicePolicyManager.resetPassword() is blocked for DPCs
        // targeting O+, and these TC51s use Full-Disk Encryption (escrow tokens disabled),
        // so resetPassword() is the ONLY way to set the lock PIN. Target ≤25 re-enables it.
        targetSdk 25
        versionCode 19
        versionName "1.7.3"

        buildConfigField "String", "CLAIM_URL", '"https://outstanding-dalmatian-787.convex.site/claim-provision"'
        buildConfigField "String", "APK_API_URL", '"https://7brylwlei6.execute-api.us-east-1.amazonaws.com/prod/scanner-mdm/apk"'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }
}

dependencies {
    // AWS IoT MQTT (core client only — no Android service wrapper needed)
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'

    // BouncyCastle for PEM private key loading (mTLS)
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'

    // AndroidX
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
